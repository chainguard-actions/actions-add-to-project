name: Test label filtering - add to project
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action invocation with label filter inputs
        id: action
        uses: .
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: ghp_fakeinvalidtoken12345678901234567890
          labeled: bug,enhancement
          label-operator: OR
        continue-on-error: true
      - name: Assert action was invoked (outcome is set)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ -z "$OUTCOME" ]; then
            echo "FAIL: action outcome was not set"
            exit 1
          fi
          echo "PASS: action was invoked with label filter, outcome=$OUTCOME"
