name: Test labeled filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action-or
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: fake-token-for-testing
          labeled: bug,enhancement
          label-operator: OR
      - name: Assert OR action ran
        run: |
          echo "Action outcome (OR): ${{ steps.action-or.outcome }}"
          if [ "${{ steps.action-or.outcome }}" = "skipped" ]; then
            echo "FAIL: action-or was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with labeled and label-operator=OR"
      - id: action-and
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: fake-token-for-testing
          labeled: bug,enhancement
          label-operator: AND
      - name: Assert AND action ran
        run: |
          echo "Action outcome (AND): ${{ steps.action-and.outcome }}"
          if [ "${{ steps.action-and.outcome }}" = "skipped" ]; then
            echo "FAIL: action-and was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with labeled and label-operator=AND"
      - id: action-not
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: fake-token-for-testing
          labeled: wontfix
          label-operator: NOT
      - name: Assert NOT action ran
        run: |
          echo "Action outcome (NOT): ${{ steps.action-not.outcome }}"
          if [ "${{ steps.action-not.outcome }}" = "skipped" ]; then
            echo "FAIL: action-not was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with labeled and label-operator=NOT"
