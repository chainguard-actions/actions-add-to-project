name: Test labeled filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: fake-token-for-testing
          labeled: bug,enhancement
          label-operator: OR
      - name: Assert action ran with label filter inputs
        run: |
          # The action is expected to fail with invalid credentials,
          # but we verify it was invoked with all optional inputs.
          # continue-on-error above ensures we reach this step.
          echo "Action completed (with or without error) - label inputs were accepted"
          echo "outcome: ${{ steps.action.outcome }}"
          echo "PASS: labeled and label-operator inputs were covered"
