name: Test labeled filter inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-url: "https://github.com/orgs/test-org/projects/1"
          github-token: "fake-token-for-testing"
          labeled: "bug,enhancement"
          label-operator: "OR"
      - name: Assert action was invoked with label inputs
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          # The action will fail with invalid credentials, but it should have been invoked
          # We just verify it ran (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action was invoked with labeled and label-operator inputs (outcome: ${{ steps.action.outcome }})"
