name: Test basic usage - project-url and github-token
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-url: https://github.com/orgs/test-org/projects/1
          github-token: fake-token-for-testing
      - name: Assert action ran (may fail due to invalid token)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action is expected to fail with an invalid token/project,
          # but we verify it was invoked with the required inputs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran (outcome: ${{ steps.action.outcome }})"
