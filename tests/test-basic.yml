name: Test basic usage - required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project-url: "https://github.com/orgs/test-org/projects/1"
          github-token: "ghp_fakeinvalidtoken1234567890abcdef"
        env:
          GITHUB_EVENT_NAME: issues
      - name: Assert action ran (expected failure due to invalid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with required inputs"
          else
            echo "FAIL: action did not run at all (outcome=$OUTCOME)"
            exit 1
          fi
